<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none" class="portfolio-logo-svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #8B5CF6)" />
      <stop offset="100%" stop-color="var(--color-secondary, #06B6D4)" />
    </linearGradient>
  </defs>
  <!-- Monogram Icon -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="14" fill="url(#logoGrad)" fill-opacity="0.12" stroke="url(#logoGrad)" stroke-width="2"/>
    <!-- Stylized WP & Code Monogram -->
    <path d="M15 16L24 33L29 23L34 33L40 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="16" r="2.5" fill="var(--color-primary, #8B5CF6)"/>
    <circle cx="40" cy="16" r="2.5" fill="var(--color-secondary, #06B6D4)"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.02em" fill="currentColor">
    ALEX<tspan fill="var(--color-primary, #8B5CF6)">.DEV</tspan>
  </text>
  <text x="69" y="46" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="0.16em" fill="var(--color-text-muted, #94A3B8)" text-transform="uppercase">
    WP &amp; WEB ARCHITECT
  </text>
</svg>
